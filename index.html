<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de D&D</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#8b2e2e">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f3ee;--card:#fff;--tx:#231f1a;--mu:#7a7268;--ac:#8b2e2e;--ac2:#f3dede;--ok:#2e7d4f;--bd:#e3ddd3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#231f19;--tx:#efe9df;--mu:#a39a8c;--ac:#e07a6f;--ac2:#3b2422;--ok:#6fcf97;--bd:#3a342b;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:70px}
#app{max-width:560px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 8px;display:flex;justify-content:space-between}
input,select{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;width:100%}
input[type=checkbox]{width:22px;height:22px}
button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:6px}.row>*{flex:1}.row>button,.row>.s{flex:0 0 auto}
.big{font-size:44px;font-weight:700;text-align:center;line-height:1}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.chip{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:4px 10px;margin:0 6px 6px 0;font-size:14px;cursor:pointer}
.chip.r{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.chip.sel{background:var(--ac);color:#fff;border-color:var(--ac)}
.mu{color:var(--mu);font-size:14px}.q{width:46px;text-align:center;flex:0 0 46px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:14px 4px;font-weight:600;color:var(--mu)}nav button.on{color:var(--ac)}
.bd{background:var(--ac);color:#fff;border-radius:99px;padding:1px 7px;font-size:12px;margin-left:4px}
.call{border-left:4px solid var(--ac)}.call.d{border-left-color:var(--ok);opacity:.6}
.btns{display:flex;gap:6px}.btns button{flex:1}
.alert{background:var(--ac);color:#fff;border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700;text-align:center;animation:pl 1s infinite;cursor:pointer}@keyframes pl{50%{opacity:.55}}
.cur{background:var(--ac2);border-radius:8px;padding:4px}textarea{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}nav button{font-size:13px}
</style></head><body><div id="app"><p class="mu">Cargando…</p></div><nav id="nav"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COND=['Cegado','Hechizado','Ensordecido','Asustado','Agarrado','Incapacitado','Invisible','Paralizado','Petrificado','Envenenado','Derribado','Apresado','Aturdido','Inconsciente','Agotamiento','Concentrado'];
const REAS=['Duda de reglas','Es mi turno','Quiero hacer una acción','Tirada / prueba','Descanso','Otra'];
const BASE=[['FUE',10],['DES',10],['CON',10],['INT',10],['SAB',10],['CAR',10],['Velocidad',30],['Iniciativa',0],['Competencia',2]];
const D={name:'',cls:'',hp:10,max:10,tmp:0,ac:10,conds:[],res:[],inv:[],attrs:[],gold:0};
let db,me,camp=null,cname='',role='',members={},chars={},calls=[],view='home',reason='',ready=false,first=true,seen=new Set(),unsub=[],det=null,prefs=[],ci={},askCo=false,ini={list:[],turn:0,round:1},rolls=[],notes='',askK=null,askDel=false;const INI={list:[],turn:0,round:1},S={dn:1,dmod:0,dp:false};
const mine=()=>chars[me.id],staff=()=>role==='dm'||role==='codm',CP=s=>'campaigns/'+camp+(s?'/'+s:'');
function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.25);navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
async function upd(id,patch){const n={...D,...(chars[id]||{}),...patch};chars[id]=n;render();try{await db.collection(CP('chars')).doc(id).set(n)}catch(e){alert('No se pudo guardar')}}
function hp(id,d){const c={...D,...chars[id]};let h=c.hp,t=c.tmp;if(d<0){let x=-d,y=Math.min(t,x);t-=y;x-=y;h=Math.max(0,h-x)}else h=Math.min(c.max,h+d);upd(id,{hp:h,tmp:t})}
function arr(id,k,fn){const a=JSON.parse(JSON.stringify((chars[id]||D)[k]||[]));fn(a);upd(id,{[k]:a})}
function hpH(c,id,own){const p=c.max?Math.max(0,Math.min(100,c.hp/c.max*100)):0;
return`<div class="big" style="color:${p<30?'var(--ac)':'var(--tx)'}">${c.hp}<span class="mu" style="font-size:20px"> / ${c.max}${c.tmp?` · +${c.tmp} temp`:''}</span></div><div class="bar"><i style="width:${p}%;background:${p<30?'var(--ac)':'var(--ok)'}"></i></div>
<div class="btns">${[-5,-1,1,5].map(d=>`<button data-a="hp" data-id="${id}" data-d="${d}">${d>0?'+'+d:d}</button>`).join('')}</div>`}
function sheetH(){const c={...D,...(mine()||{})},id=me.id;
const opts=COND.filter(x=>!c.conds.includes(x)).map(x=>`<option>${x}</option>`).join('');
return`<div class="card"><div class="row"><input data-f="name" placeholder="Nombre del personaje" value="${esc(c.name)}"></div><div class="row"><input data-f="cls" placeholder="Clase, nivel, raza…" value="${esc(c.cls)}"></div></div>
<div class="card"><h2>Vida</h2>${hpH(c,id)}
<div class="row" style="margin-top:10px"><label class="mu s">Máx</label><input type="number" data-f="max" data-n value="${c.max}"><label class="mu s">Temp</label><input type="number" data-f="tmp" data-n value="${c.tmp}"><label class="mu s">CA</label><input type="number" data-f="ac" data-n value="${c.ac}"></div></div>
<div class="card"><h2>Estados</h2>${c.conds.map((x,i)=>`<span class="chip" data-a="rmcond" data-i="${i}">${esc(x)} ✕</span>`).join('')||'<span class="mu">Ninguno</span>'}
<div class="row" style="margin-top:8px"><select id="cs"><option value="">Añadir estado…</option>${opts}</select><button data-a="addcond">+</button></div>
<div class="row"><input id="cc" placeholder="Estado personalizado"><button data-a="addcc">+</button></div></div>
<div class="card"><h2>Recursos <span class="mu" style="text-transform:none">espacios de conjuro, ki, usos…</span></h2>
${c.res.map((r,i)=>`<div class="row"><input data-arr="res" data-i="${i}" data-k="n" value="${esc(r.n)}"><button data-a="ri" data-i="${i}" data-d="-1">−</button><b class="s">${r.c}/<input class="q" style="display:inline-block;width:46px" type="number" data-arr="res" data-i="${i}" data-k="m" data-n value="${r.m}"></b><button data-a="ri" data-i="${i}" data-d="1">+</button><button data-a="del" data-k="res" data-i="${i}">✕</button></div>`).join('')}
<div class="row"><input id="rn" placeholder="Nuevo recurso (ej. Espacios nv 1)"><input id="rm" class="q" type="number" placeholder="Máx"><button data-a="addres">+</button></div>
<button data-a="rest" class="mu">Descanso largo: restaurar todo</button></div>
<div class="card"><h2>Atributos y datos</h2>
${c.attrs.map((r,i)=>`<div class="row"><input data-arr="attrs" data-i="${i}" data-k="n" value="${esc(r.n)}"><input data-arr="attrs" data-i="${i}" data-k="v" value="${esc(r.v)}"><button data-a="del" data-k="attrs" data-i="${i}">✕</button></div>`).join('')}
<div class="row"><input id="an" placeholder="Nombre (ej. CD de conjuros)"><input id="av" placeholder="Valor"><button data-a="addattr">+</button></div>
${c.attrs.length?'':'<button data-a="base">Cargar atributos básicos 5e</button>'}</div>
<div class="card"><h2>Inventario <span style="text-transform:none">Oro: <input type="number" data-f="gold" data-n value="${c.gold}" style="width:80px;display:inline-block;padding:2px 6px"></span></h2>
${c.inv.map((r,i)=>`<div class="row"><input type="checkbox" class="s" ${r.e?'checked':''} data-arr="inv" data-i="${i}" data-k="e" data-b title="Equipado"><input data-arr="inv" data-i="${i}" data-k="n" value="${esc(r.n)}"><button data-a="qi" data-i="${i}" data-d="-1">−</button><b class="s">${r.q}</b><button data-a="qi" data-i="${i}" data-d="1">+</button><button data-a="del" data-k="inv" data-i="${i}">✕</button></div>`).join('')||'<p class="mu">Vacío</p>'}
<div class="row"><input id="in" placeholder="Nuevo objeto"><input id="iq" class="q" type="number" placeholder="Cant" value="1"><button data-a="additem">+</button></div>
<p class="mu">La casilla marca el objeto como equipado.</p></div>
<div class="card"><h2>Notas (el DM puede verlas)</h2><textarea rows="4" data-f="notes">${esc(c.notes||'')}</textarea></div>`}
function callH(){const my=calls.filter(c=>c.pid===me.id).sort((a,b)=>b.ts-a.ts).slice(0,5);
return`<div class="card"><h2>Llamar al DM</h2><p class="mu">Elige el motivo. El DM y co-DM verán quién eres y qué necesitas.</p>
<div>${REAS.map(r=>`<span class="chip r ${reason===r?'sel':''}" data-a="reason" data-r="${r}">${r}</span>`).join('')}</div>
<div class="row" style="margin-top:8px"><input id="ct" placeholder="Detalle (opcional)"></div>
<button class="p" style="width:100%;padding:16px;font-size:18px" data-a="call">🔔 Llamar al DM</button></div>
${my.length?`<div class="card"><h2>Tus llamadas</h2>${my.map(c=>`<div class="mu">${tm(c.ts)} · ${esc(c.reason)} — ${c.done?'✔ atendida por '+esc(c.by||'DM'):'⏳ esperando'}</div>`).join('')}</div>`:''}`}
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function dmH(){const p=calls.filter(c=>!c.done).sort((a,b)=>a.ts-b.ts),d=calls.filter(c=>c.done).sort((a,b)=>b.ts-a.ts).slice(0,5);
const cl=c=>`<div class="card call ${c.done?'d':''}"><b>${esc(c.cname||c.pname)}</b> <span class="mu">(${esc(c.pname)}) · ${tm(c.ts)}</span><div>${esc(c.reason)}${c.text?': '+esc(c.text):''}</div>${c.done?'':`<button class="p" style="margin-top:8px" data-a="done" data-id="${c.id}">Atender</button>`}</div>`;
return`<h2>Llamadas pendientes (${p.length})</h2>${p.map(cl).join('')||'<p class="mu">Nadie está llamando.</p>'}
${d.length?`<h2>Atendidas <button data-a="clear" style="padding:2px 8px">Limpiar</button></h2>${d.map(cl).join('')}`:''}
<h2 style="margin-top:16px">Grupo</h2>${Object.entries(chars).filter(([id])=>(members[id]||{}).role!=='dm'||true).map(([id,c])=>{c={...D,...c};return`<div class="card"><b>${esc(c.name||'Sin nombre')}</b> <span class="mu">${esc((members[id]||{}).name)} · ${esc(c.cls)} · CA ${c.ac}</span>${hpH(c,id)}<button data-a="det" data-id="${id}" style="width:100%;margin-top:8px">Ver ficha completa</button><div style="margin-top:8px">${c.conds.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div>`}).join('')||'<p class="mu">Aún no hay fichas.</p>'}
<div class="card" style="margin-top:12px"><h2>Notas privadas (solo tú)</h2><textarea rows="5" data-note>${esc(notes)}</textarea></div>`}
function homeH(){return`<div class="row"><span class="mu">Hola, ${esc(me.name)}</span><button data-a="logout" style="padding:2px 10px">Salir</button></div><div class="card"><h2>Mis campañas</h2>${prefs.map(p=>`<div class="row"><button data-a="open" data-id="${p.code}" data-n="${esc(p.name)}" style="text-align:left"><b>${esc(p.name)}</b> <span class="mu">${p.code}</span></button><button class="s" data-a="forget" data-id="${p.code}" title="Quitar de mi lista">✕</button></div>`).join('')||'<p class="mu">Aún no tienes campañas.</p>'}</div>
<div class="card"><h2>Crear campaña (serás DM)</h2><div class="row"><input id="cn" placeholder="Nombre de la campaña"><button class="p" data-a="create">Crear</button></div></div>
<div class="card"><h2>Unirme con código</h2><div class="row"><input id="jc" placeholder="Código de campaña o de co-DM" maxlength="8"><button class="p" data-a="join">Entrar</button></div></div>`}
const RN={dm:'DM',codm:'Co-DM',player:'Jugador'};
function memH(){const dm=role==='dm',cu=ci.codmUid&&members[ci.codmUid];
const slot=!dm?'':cu?`<div class="row"><span>Co-DM: <b>${esc(cu.name)}</b></span><button data-a="rmcodm">Quitar co-DM</button></div>`
:ci.codmCode?`<div class="big" style="letter-spacing:.12em;font-size:34px">${ci.codmCode}</div><p class="mu" style="text-align:center">Código de un solo uso. Compártelo solo con tu co-DM.</p><div class="btns"><button data-a="cancelcode">Cancelar código</button><button data-a="gen">Código nuevo</button></div>`
:askCo?`<p><b>¿Deseas agregar a un co-DM?</b></p><div class="btns"><button class="p" data-a="gen">Sí</button><button data-a="noco">No</button></div>`
:`<button class="p" data-a="askco" style="width:100%">➕ Agregar co-DM</button><p class="mu">Solo hay un espacio de co-DM.</p>`;
return`<div class="card"><h2>Código de la campaña</h2><div class="big" style="letter-spacing:.15em">${camp}</div><p class="mu" style="text-align:center">Compártelo con tus jugadores.</p></div>
${dm?`<div class="card"><h2>Co-DM</h2>${slot}</div>`:''}
<div class="card"><h2>Miembros</h2>${Object.entries(members).map(([id,m])=>`<div class="row"><span><b>${esc(m.name)}</b> <span class="mu">${RN[m.role]}</span></span>${m.role==='player'?(askK===id?`<button class="p" data-a="kick" data-id="${id}">Confirmar</button><button data-a="nok">No</button>`:`<button data-a="askk" data-id="${id}">Expulsar</button>`):''}</div>`).join('')}</div>
${dm?`<div class="card"><h2>Zona peligrosa</h2>${askDel?'<p><b>¿Borrar toda la campaña? No se puede deshacer.</b></p><div class="btns"><button class="p" data-a="deldel">Sí, borrar</button><button data-a="nodel">No</button></div>':'<button data-a="askdel" style="width:100%">Borrar campaña</button>'}</div>`:''}`}
function detH(id){const c={...D,...chars[id]};return`<button data-a="back">← Volver</button><div class="card" style="margin-top:10px"><b>${esc(c.name||'Sin nombre')}</b> <span class="mu">${esc(c.cls)} · CA ${c.ac} · ${esc((members[id]||{}).name)}</span>${hpH(c,id)}<div style="margin-top:8px">${c.conds.map(x=>`<span class="chip">${esc(x)}</span>`).join('')||'<span class="mu">Sin estados</span>'}</div></div>
<div class="card"><h2>Recursos</h2>${c.res.map(r=>`<div>${esc(r.n)}: <b>${r.c}/${r.m}</b></div>`).join('')||'<span class="mu">Ninguno</span>'}</div>
<div class="card"><h2>Atributos</h2>${c.attrs.map(r=>`<span class="chip r">${esc(r.n)} ${esc(r.v)}</span>`).join('')||'<span class="mu">Ninguno</span>'}</div>
<div class="card"><h2>Inventario · Oro ${c.gold}</h2>${c.inv.map(r=>`<div>${r.e?'🛡 ':''}${esc(r.n)} ×${r.q}</div>`).join('')||'<span class="mu">Vacío</span>'}</div>
<div class="card"><h2>Notas del jugador</h2><div style="white-space:pre-wrap">${esc(c.notes)||'<span class="mu">Sin notas</span>'}</div></div>`}
function render(){if(!ready)return;const pend=calls.filter(c=>!c.done).length,isDM=staff();
const bn=isDM&&pend&&view!=='dm'?`<div class="alert" data-a="tab" data-v="dm">🔔 ${pend} llamada(s) esperando</div>`:'';
$('#app').innerHTML=bn+(camp?`<p class="mu" style="margin:0 0 8px"><b>${esc(cname)}</b> · ${RN[role]||''}</p>`:'')+(view==='home'?homeH():view==='mem'?memH():view==='ini'?iniH():view==='sheet'?sheetH():view==='call'?callH():det?detH(det):dmH());
$('#nav').innerHTML=(!camp?[]:isDM?[['dm','🛡 Panel'],['ini','⚔ Combate'],['mem','👥 Miembros'],['home','🏠 Inicio']]:[['sheet','📜 Ficha'],['call','🔔 Llamar'],['ini','⚔ Combate'],['home','🏠 Inicio']]).map(([k,l])=>`<button class="${view===k?'on':''}" data-a="tab" data-v="${k}">${l}${k==='dm'&&pend?`<span class="bd">${pend}</span>`:''}</button>`).join('')}
async function saveIni(p){ini={...ini,...p};render();try{await db.collection(CP('ini')).doc('main').set(ini)}catch(e){alert('No se pudo guardar')}}
function diceH(){const vis=rolls.filter(r=>!r.priv||staff()||r.pid===me.id).sort((a,b)=>b.ts-a.ts).slice(0,12);
return`<div class="card"><h2>Dados ${staff()&&rolls.length?'<button data-a="clrroll" style="padding:2px 8px">Limpiar</button>':''}</h2>
<div class="row"><input class="q" type="number" data-s="dn" value="${S.dn}"><span class="s mu">dados + mod</span><input class="q" type="number" data-s="dmod" value="${S.dmod}"><label class="s mu"><input type="checkbox" data-s="dp" ${S.dp?'checked':''} style="width:18px;height:18px;vertical-align:middle"> solo DM</label></div>
<div class="btns" style="flex-wrap:wrap">${[4,6,8,10,12,20,100].map(n=>`<button data-a="roll" data-d="${n}">d${n}</button>`).join('')}</div>
${vis.map(r=>`<div class="mu" style="margin-top:6px"><b>${esc(r.name)}</b> ${esc(r.expr)}: <b style="color:var(--tx);font-size:18px">${r.total}</b> (${esc(r.detail)})${r.priv?' 🔒':''}${r.nat===1?' ⭐ ¡Crítico!':r.nat===2?' 💀 Pifia':''}</div>`).join('')}</div>`}
function iniH(){const st=staff(),L=ini.list,cur=L[ini.turn];
return`${!st&&cur&&cur.id===me.id?'<div class="alert" style="animation:none">⚔ ¡Es tu turno!</div>':''}
<div class="card"><h2>Iniciativa <span>Ronda ${ini.round}</span></h2>
${L.map((e,i)=>`<div class="row ${i===ini.turn?'cur':''}"><b class="s">${i===ini.turn?'▶':'·'}</b><span>${esc(e.n)}</span>${st||e.id===me.id?`<input class="q" type="number" data-ini="${i}" value="${e.v}">`:`<b class="s">${e.v}</b>`}${st?`<button data-a="inidel" data-i="${i}">✕</button>`:''}</div>`).join('')||'<p class="mu">No hay combate en curso.</p>'}
${st?`<div class="btns" style="margin-top:8px"><button class="p" data-a="ininext">Siguiente turno</button><button data-a="inisort">Ordenar</button></div>
<div class="row" style="margin-top:8px"><input id="en" placeholder="Enemigo / PNJ"><input id="ev" class="q" type="number" placeholder="Ini"><button data-a="iniadd">+</button></div>
<div class="btns"><button data-a="iniplay">Añadir jugadores</button><button data-a="iniend">Terminar combate</button></div>`:''}</div>${diceH()}`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i,id=b.dataset.id||(me&&me.id),c=me&&{...D,...mine()};
if(a==='tab'){view=b.dataset.v;det=null;if(view==='home'&&camp)leave();render()}
else if(a==='login'){const pr=new firebase.auth.GoogleAuthProvider();try{await firebase.auth().signInWithPopup(pr)}catch(x){if(x.code!=='auth/popup-closed-by-user')try{await firebase.auth().signInWithRedirect(pr)}catch(y){loginH('No se pudo iniciar sesión')}}}
else if(a==='logout')firebase.auth().signOut();
else if(a==='open')open(id,b.dataset.n);
else if(a==='forget'){prefs=prefs.filter(p=>p.code!==id);savePrefs();render()}
else if(a==='askk'){askK=id;render()}else if(a==='nok'){askK=null;render()}
else if(a==='kick'){try{await db.collection(CP('members')).doc(id).delete();await db.collection(CP('chars')).doc(id).delete()}catch(x){alert('No se pudo expulsar')}askK=null;render()}
else if(a==='askdel'){askDel=true;render()}else if(a==='nodel'){askDel=false;render()}
else if(a==='deldel'){const cd=camp,M=Object.keys(members).filter(k=>k!==me.id),Q=x=>'campaigns/'+cd+'/'+x,cc=ci.codmCode,K=[['calls',calls.map(x=>x.id)],['rolls',rolls.map(x=>x.id)],['chars',Object.keys(chars)],['ini',['main']]];leave();
try{const q=[];K.forEach(([p,ids])=>ids.forEach(i=>q.push(db.collection(Q(p)).doc(i).delete())));if(cc)q.push(db.collection('codmcodes').doc(cc).delete());await Promise.all(q);await Promise.all(M.map(k=>db.collection(Q('members')).doc(k).delete()));await db.collection('campaigns').doc(cd).delete();await db.collection(Q('members')).doc(me.id).delete();prefs=prefs.filter(p=>p.code!==cd);savePrefs();render()}catch(x){alert('No se pudo borrar todo')}}
else if(a==='roll'){const sd=+b.dataset.d,n=Math.max(1,Math.min(20,S.dn||1)),r=[];for(let k=0;k<n;k++)r.push(1+Math.floor(Math.random()*sd));const rid=Date.now()+''+Math.floor(Math.random()*999);
db.collection(CP('rolls')).doc(rid).set({id:rid,pid:me.id,name:c.name||me.name||'Jugador',expr:n+'d'+sd+(S.dmod?(S.dmod>0?'+':'')+S.dmod:''),detail:r.join('+'),total:r.reduce((x,y)=>x+y,0)+S.dmod,ts:Date.now(),priv:!!S.dp,nat:sd===20&&n===1?(r[0]===20?1:r[0]===1?2:0):0})}
else if(a==='clrroll')rolls.forEach(r=>db.collection(CP('rolls')).doc(r.id).delete());
else if(a==='ininext'){const L=ini.list;if(!L.length)return;let t=ini.turn+1,r=ini.round;if(t>=L.length){t=0;r++}saveIni({turn:t,round:r})}
else if(a==='inisort')saveIni({list:[...ini.list].sort((x,y)=>y.v-x.v),turn:0});
else if(a==='iniadd'){const n=$('#en').value.trim();n&&saveIni({list:[...ini.list,{id:'x'+Date.now(),n,v:+$('#ev').value||0}]})}
else if(a==='iniplay'){const L=[...ini.list];Object.entries(chars).forEach(([u,ch])=>{if(!L.some(e=>e.id===u))L.push({id:u,n:ch.name||(members[u]||{}).name||'Jugador',v:0})});saveIni({list:L})}
else if(a==='inidel'){const L=[...ini.list];L.splice(i,1);saveIni({list:L,turn:Math.max(0,Math.min(i<ini.turn?ini.turn-1:ini.turn,L.length-1))})}
else if(a==='iniend')saveIni({list:[],turn:0,round:1});else if(a==='create')create();else if(a==='join')join();
else if(a==='back'){det=null;render()}else if(a==='det'){det=id;render()}
else if(a==='askco'){askCo=true;render()}else if(a==='noco'){askCo=false;render()}
else if(a==='gen'||a==='cancelcode'||a==='rmcodm'){try{
if(ci.codmCode)await db.collection('codmcodes').doc(ci.codmCode).delete();
if(a==='gen'){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let k='';for(let n=0;n<8;n++)k+=A[Math.floor(Math.random()*A.length)];
await db.collection('codmcodes').doc(k).set({camp,used:false});await db.collection('campaigns').doc(camp).update({codmCode:k})}
else if(a==='cancelcode')await db.collection('campaigns').doc(camp).update({codmCode:null});
else{if(ci.codmUid)await db.collection(CP('members')).doc(ci.codmUid).update({role:'player'});await db.collection('campaigns').doc(camp).update({codmUid:null,codmCode:null})}
askCo=false;render()}catch(x){alert('No se pudo completar')}}
else if(a==='hp')hp(id,+b.dataset.d);
else if(a==='rmcond')arr(me.id,'conds',x=>x.splice(i,1));
else if(a==='addcond'){const v=$('#cs').value;v&&arr(me.id,'conds',x=>x.push(v))}
else if(a==='addcc'){const v=$('#cc').value.trim();v&&arr(me.id,'conds',x=>x.push(v))}
else if(a==='ri')arr(me.id,'res',x=>x[i].c=Math.max(0,Math.min(x[i].m,x[i].c+ +b.dataset.d)));
else if(a==='addres'){const n=$('#rn').value.trim(),m=+$('#rm').value||1;n&&arr(me.id,'res',x=>x.push({n,c:m,m}))}
else if(a==='rest')arr(me.id,'res',x=>x.forEach(r=>r.c=r.m));
else if(a==='del')arr(me.id,b.dataset.k,x=>x.splice(i,1));
else if(a==='addattr'){const n=$('#an').value.trim();n&&arr(me.id,'attrs',x=>x.push({n,v:$('#av').value}))}
else if(a==='base')arr(me.id,'attrs',x=>BASE.forEach(([n,v])=>x.push({n,v:String(v)})));
else if(a==='qi')arr(me.id,'inv',x=>x[i].q=Math.max(0,x[i].q+ +b.dataset.d));
else if(a==='additem'){const n=$('#in').value.trim();n&&arr(me.id,'inv',x=>x.push({n,q:+$('#iq').value||1,e:false}))}
else if(a==='reason'){reason=b.dataset.r;const t=$('#ct')?.value;render();if($('#ct'))$('#ct').value=t||''}
else if(a==='call'){if(!reason)return alert('Elige un motivo');const cid=Date.now()+''+Math.floor(Math.random()*999);
try{await db.collection(CP('calls')).doc(cid).set({id:cid,pid:me.id,pname:me.name||'Jugador',cname:c.name,reason,text:$('#ct').value.trim(),ts:Date.now(),done:false});reason='';render()}catch(x){alert('No se pudo enviar')}}
else if(a==='done')db.collection(CP('calls')).doc(id).update({done:true,by:me.name||'DM'});
else if(a==='clear')calls.filter(c=>c.done).forEach(c=>db.collection(CP('calls')).doc(c.id).delete());
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.s){S[t.dataset.s]=t.type==='checkbox'?t.checked:(+t.value||0);return}
if(t.dataset.note){notes=t.value;db.collection('data/users/'+me.id).doc('notes_'+camp).set({t:notes});return}
if(t.dataset.ini!==undefined){const L=JSON.parse(JSON.stringify(ini.list));L[+t.dataset.ini].v=+t.value||0;saveIni({list:L});return}
const v=t.dataset.b!==undefined?t.checked:t.dataset.n!==undefined?(+t.value||0):t.value;
if(t.dataset.f)upd(me.id,{[t.dataset.f]:v});
else if(t.dataset.arr)arr(me.id,t.dataset.arr,x=>x[+t.dataset.i][t.dataset.k]=v)});
const PD=()=>db.collection('data/users/'+me.id).doc('camps');
async function savePrefs(){try{await PD().set({list:prefs})}catch(e){}}
function leave(){unsub.forEach(u=>u());unsub=[];camp=null;role='';ini={...INI};rolls=[];notes='';askK=null;askDel=false;ci={};askCo=false;members={};chars={};calls=[];det=null;first=true;seen=new Set();view='home';render()}
function open(code,name){leave();camp=code;cname=name;if(!prefs.some(p=>p.code===code)){prefs.push({code,name});savePrefs()}
unsub.push(db.collection('campaigns').doc(code).onSnapshot(d=>{ci=d.data()||{};render()}));
unsub.push(db.collection(CP('members')).onSnapshot(s=>{members={};s.docs.forEach(d=>members[d.id]=d.data());if(!s.metadata.fromCache&&!members[me.id]){alert('Ya no formas parte de esta campaña');prefs=prefs.filter(p=>p.code!==camp);savePrefs();return leave()}role=(members[me.id]||{}).role||'player';if(view==='home'){view=staff()?'dm':'sheet'}render()}));
unsub.push(db.collection(CP('ini')).doc('main').onSnapshot(d=>{ini=d.exists?{...INI,...d.data()}:{...INI};render()}));
unsub.push(db.collection(CP('rolls')).onSnapshot(s=>{rolls=s.docs.map(d=>d.data());render()}));
db.collection('data/users/'+me.id).doc('notes_'+code).get().then(d=>{notes=d.exists?(d.data().t||''):''}).catch(()=>{});
unsub.push(db.collection(CP('chars')).onSnapshot(s=>{chars={};s.docs.forEach(d=>chars[d.id]=d.data());if(!document.activeElement||!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()}));
unsub.push(db.collection(CP('calls')).onSnapshot(s=>{calls=s.docs.map(d=>d.data());if(staff()&&!first&&calls.some(c=>!c.done&&!seen.has(c.id)))beep();calls.forEach(c=>seen.add(c.id));first=false;render()}))}
async function create(){const n=$('#cn').value.trim();if(!n)return;const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let code='';for(let i=0;i<6;i++)code+=A[Math.floor(Math.random()*A.length)];
try{await db.collection('campaigns').doc(code).set({name:n,owner:me.id});camp=code;await db.collection(CP('members')).doc(me.id).set({role:'dm',name:me.name||'DM'});open(code,n)}catch(e){alert('No se pudo crear')}}
async function join(){const code=$('#jc').value.trim().toUpperCase();if(!code)return;
try{const cc=await db.collection('codmcodes').doc(code).get();
if(cc.exists){const d=cc.data();if(d.used)return alert('Este código ya fue usado');const cd=await db.collection('campaigns').doc(d.camp).get();camp=d.camp;
await db.collection(CP('members')).doc(me.id).set({role:'codm',name:me.name||'Co-DM',code});
await db.collection('codmcodes').doc(code).update({used:true,usedBy:me.id});
await db.collection('campaigns').doc(d.camp).update({codmUid:me.id,codmCode:null});return open(d.camp,cd.data().name)}
const d=await db.collection('campaigns').doc(code).get();if(!d.exists)return alert('Código no encontrado');camp=code;
const m=await db.collection(CP('members')).doc(me.id).get();if(!m.exists)await db.collection(CP('members')).doc(me.id).set({role:'player',name:me.name||'Jugador'});open(code,d.data().name)}catch(e){camp=null;alert('No se pudo entrar')}}
function loginH(msg){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="card" style="margin-top:40px;text-align:center"><div class="big">🎲</div><h2 style="justify-content:center;margin-top:12px">Mesa de D&amp;D</h2><p class="mu">Fichas, combate y llamadas al DM para tu mesa.</p>${msg?`<p style="color:var(--ac)">${msg}</p>`:''}<button class="p" style="width:100%;padding:14px" data-a="login">Entrar con Google</button></div>`}
async function init(){
if(typeof FIREBASE_CONFIG==='undefined'||/PEGA/.test(FIREBASE_CONFIG.apiKey||'PEGA'))return loginH('Falta configurar Firebase. Revisa LEEME.md.');
try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){return loginH('Error al iniciar Firebase')}
firebase.auth().onAuthStateChanged(async u=>{
if(!u){ready=false;leave();loginH();return}
me={id:u.uid,name:u.displayName||'Jugador'};
try{const p=await PD().get();prefs=(p.exists&&p.data().list)||[]}catch(e){prefs=[]}
ready=true;render()})}
document.addEventListener('focusout',()=>setTimeout(()=>{if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()},50));
init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
